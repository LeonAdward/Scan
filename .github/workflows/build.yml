name: Build 商品扫描 offline OCR HTTPS WebView
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'patch.py'
      - 'asset_loader_patch.py'
      - 'base.apk'
      - 'scanner.js'
      - 'server-config.js'
      - 'server-client.js'
      - 'assets/**'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL --retry 3 https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | python3 -c 'import json,sys; a=json.load(sys.stdin)["assets"]; print(next(x["browser_download_url"] for x in a if x["name"].endswith(".jar") and "apktool" in x["name"].lower()))')
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version
      - name: Decode original APK
        run: java -jar "$RUNNER_TEMP/apktool.jar" d -f base.apk -o work
      - name: Apply existing camera permission patch
        run: python3 patch.py work scanner.js
      - name: Install offline OCR and HTTPS asset bridge
        shell: bash
        run: |
          set -euo pipefail
          cp -a assets/. work/assets/
          python3 asset_loader_patch.py work
          test -s work/assets/ocr/worker.min.js
          test -s work/assets/ocr/core/tesseract-core-relaxedsimd-lstm.wasm.js
          test -s work/assets/ocr/lang/eng.traineddata.gz
      - name: Verify scanner JavaScript syntax
        run: |
          node --check assets/scanner.js
          node --check assets/ocr.js
          python3 -m py_compile patch.py asset_loader_patch.py
      - name: Rebuild APK
        run: java -jar "$RUNNER_TEMP/apktool.jar" b work -o scanner-unsigned-unaligned.apk
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          unzip -t scanner-unsigned-unaligned.apk | tail -1
          unzip -l scanner-unsigned-unaligned.apk | grep -q 'assets/ocr/worker.min.js'
          unzip -l scanner-unsigned-unaligned.apk | grep -q 'assets/ocr/lang/eng.traineddata.gz'
          mkdir -p out
          cp scanner-unsigned-unaligned.apk out/商品扫描_离线OCR_unsigned.apk
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile
          apk=Path('scanner-unsigned-unaligned.apk')
          with zipfile.ZipFile(apk) as z:
              entries=[n for n in z.namelist() if n.startswith('assets/') and (n in ('assets/index.html','assets/scanner.js','assets/ocr.js') or n.startswith('assets/ocr/'))]
              dex=[n for n in z.namelist() if n.endswith('.dex')]
              assert entries and dex
              assert any(b'appassets.androidplatform.net' in z.read(n) for n in dex)
              with zipfile.ZipFile('out/商品扫描_离线OCR_修改文件.zip','w',zipfile.ZIP_DEFLATED) as p:
                  for n in entries+dex+['AndroidManifest.xml']:
                      p.writestr(n,z.read(n))
          with zipfile.ZipFile('out/商品扫描_离线OCR_修改文件.zip') as p:
              assert p.testzip() is None
          PYCODE
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 商品扫描-V14-startup-repair
          path: out/*
          if-no-files-found: error
