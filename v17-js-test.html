<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#101c2c;color:#fff;font:18px system-ui;padding:24px}button{font-size:20px;padding:18px}p{line-height:1.6}</style></head><body><h2>V17 JavaScript 启动诊断</h2><p id="js">JavaScript 尚未执行</p><button id="btn" onclick="document.getElementById('click').textContent='按钮响应成功（内联事件）'">测试按钮</button><p id="click">等待点击</p><p id="event">事件监听尚未运行</p><script>document.getElementById('js').textContent='JavaScript 执行成功';document.getElementById('btn').addEventListener('click',function(){document.getElementById('event').textContent='事件监听响应成功';});</script></body></html>
